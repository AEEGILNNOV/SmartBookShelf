; HC-SR04 非阻塞测试工程：串口打印距离，不拖住任务

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags =
  ; 串口
  -DSERIAL_BAUD=115200

  ; HC-SR04 引脚（回波已加分压电阻再进 GPIO）
  -DUS_TRIG_PIN=17
  -DUS_ECHO_PIN=18

  ; 单次测距超时，单位 us；38000us 大约对应 6.5 米
  -DUS_TIMEOUT_US=38000UL

  ; 测距周期，单位 ms
  -DUS_INTERVAL_MS=60

  ; 无效读数阈值，单位 mm
  -DUS_MIN_MM=20
  -DUS_MAX_MM=4000

  ; 任务栈和优先级
  -DUS_TASK_STACK=4096
  -DUS_TASK_PRIORITY=2
  -DREPORT_TASK_STACK=4096
  -DREPORT_TASK_PRIORITY=1

  ; 队列长度
  -DUS_DISTANCE_QUEUE_SIZE=8
