; PlatformIO Project Configuration File
;
; CNN_Test —— HUSKYLENS 2（二哈二代）内置 CNN 识别测试
;   ESP32-S3-DevKitC-1 N16R8 (16MB QIO Flash + 8MB OPI PSRAM)
;   只用到 I2C：绿线 SDA=GPIO1  蓝线 SCL=GPIO2  VCC=5V/3V3  GND 共地
;
; 二哈自己带 NPU，CNN 推理在它内部跑，ESP32 这边只做 I2C 通信和串口打印。
;
; 编译烧录：
;   pio run -e esp32-s3-devkitc-1 -t upload
;   pio device monitor -e esp32-s3-devkitc-1        (115200)
;
; 注意：GPIO 33-37 被 OPI PSRAM 占用，不能接外设。
; ---------------------------------------------------------------------------

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 板卡默认按 N8 无 PSRAM 定义，下面几行把它变成 N16R8
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM

  ; 二哈 I2C 接线（改线只改这里，不要改源码）
  -DPIN_HUSKY_SDA=1
  -DPIN_HUSKY_SCL=2

  ; I2C 速率(Hz)。通信不稳时降到 50000 试试
  -DHUSKY_I2C_HZ=100000

  ; I2C 事务超时(ms)。ESP32 默认只有 50ms，二哈拉伸时钟会超时，别改小
  -DHUSKY_I2C_TIMEOUT_MS=1000

  ; 库内部重试次数。库每次发送都会把超时硬写回 5000ms，
  ; 设备不在时阻塞时间 = retry * 超时，调小可以减少等待
  -DHUSKY_RETRY=3

  ; 任务节奏(ms)
  -DHUSKY_READ_INTERVAL_MS=300
  -DHUSKY_RECONNECT_INTERVAL_MS=2000
  -DPRINT_INTERVAL_MS=500
  -DMONITOR_INTERVAL_MS=2000

; 依赖库：DFRobot_HuskylensV2 已经 vendor 到 lib/ 目录，离线也能编译。
; 想改回在线依赖，删掉 lib/DFRobot_HuskylensV2 后放开下面两行：
; lib_deps =
;   https://github.com/dfrobot/DFRobot_HuskylensV2.git

upload_speed = 921600
monitor_speed = 115200
