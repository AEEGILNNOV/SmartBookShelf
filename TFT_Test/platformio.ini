; PlatformIO Project Configuration File
;
; SmartBookShelf / TFT_Test
; ESP32-S3 N16R8 + 2.8 寸 SPI ILI9341（240x320，竖屏）单屏自检程序
;
; 接线（与 LVGLin240320TFTLCD、Master/include/board_pins.h 完全一致）：
;   屏 VCC     -> 3V3（不要接 5V）
;   屏 GND     -> GND
;   屏 SCK/CLK -> GPIO12
;   屏 SDA/MOSI-> GPIO11
;   屏 MISO    -> 不接（本方案不读屏，读 ID 返回 0 属正常）
;   屏 CS      -> GPIO10
;   屏 DC/RS   -> GPIO9
;   屏 RESET   -> GPIO8
;   屏 LED/BL  -> GPIO47（由代码控制，排错时不要直接接 VCC）
;   按键（可选，按下为高电平）：BTN1->GPIO42  BTN2->GPIO41  BTN3->GPIO40
;
; 用法：
;   pio run -t upload
;   pio device monitor        ; 115200
;
; 换成别的屏（例如 ST7735 128x160）时，只改下面 build_flags 里的驱动和尺寸宏。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 16MB
; 板级定义只认 N8，这两行才是 N16R8：qio（quad flash）+ opi（octal PSRAM）。
; 不改的话会在二级 bootloader 卡死，屏永远不亮。
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM

  ; TFT_eSPI：ILI9341 240x320，竖屏 rotation 2
  -DUSER_SETUP_LOADED
  -DILI9341_DRIVER
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_MISO=-1
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=8
  -DTFT_BL=47
  -DTFT_BACKLIGHT_ON=1
  -DTFT_ROTATION=2
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=16000000
  ; ESP32-S3 Arduino 核把 FSPI 映射成 0，TFT_eSPI 2.5.43 会把它当成寄存器地址，
  ; 必须强制成真正的 SPI2 序号。
  -DUSE_FSPI_PORT

  ; 按键（可选）：input_pulldown，按下为高电平
  -DBUTTON_PIN1=42
  -DBUTTON_PIN2=41
  -DBUTTON_PIN3=40
  -DBUTTON_TRUE_VALUE=1

  ; 队列长度
  -DBUTTON_QUEUE_SIZE=10
  -DTESTFLAG_QUEUE_SIZE=10

lib_deps =
  bodmer/TFT_eSPI@2.5.43

upload_speed = 921600
monitor_speed = 115200
