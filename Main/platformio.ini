; PlatformIO Project Configuration File
;
; SmartBookShelf / Main —— 主控整合工程（以库的形式组织）
;   ESP32-S3-DevKitC-1 N16R8 (16MB QIO Flash + 8MB OPI PSRAM)
;   + 2.8" SPI ILI9341 240x320 竖屏
;   + HUSKYLENS 2（二哈）I2C 内置 CNN 识别
;   + ULN2003 步进 + HC-SR04 测距（预留）
;
; 功能代码全部在 lib/ 下的独立库里，src/main.cpp 只负责建任务和拼装：
;   lib/HuskyLib       二哈 I2C + CNN 结果读取 + 学习/知识库
;   lib/DisplayLib     TFT_eSPI + LVGL 8.4 中文界面（状态页/系统信息页/书列表页）
;   lib/SysInfoLib     RAM/PSRAM/Flash/运行时间采集
;   lib/ButtonLib      按键消抖 + 事件队列
;   lib/SerialCmdLib   串口命令行解析 + 注册式分派
;   include/config.h   全项目唯一配置来源（引脚/节奏/开关/阈值）
;
; 编译烧录：
;   pio run -e esp32-s3-devkitc-1 -t upload
;   pio device monitor -e esp32-s3-devkitc-1        (115200)
;
; 注意：GPIO 26-32 = 封装内 Flash，GPIO 33-37 = OPI PSRAM，绝对不能接外设。
;
; ===========================================================================
; 配置放哪里？
;   业务参数（引脚、任务节奏、队列长度、模块开关、机械阈值）全部在
;   include/config.h 里，改配置请改那个文件，不要在这里堆 -D。
;
;   这里只保留两类“必须在编译命令行里给”的宏：
;     1) PlatformIO/框架需要的（BOARD_HAS_PSRAM、-Iinclude）；
;     2) TFT_eSPI 的 USER_SETUP 宏 —— 它是第三方库的编译开关，
;        必须在编译 TFT_eSPI 库本身时就存在，所以只能放 build_flags。
;   想临时覆盖 config.h 的某个宏，仍然可以在下面加 -DXXX=yyy（优先级更高）。
; ===========================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 板卡默认按 N8 无 PSRAM 定义，下面几行把它变成 N16R8
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

lib_ldf_mode = deep

build_flags =
  -DBOARD_HAS_PSRAM
  -Iinclude

  ; ---- TFT_eSPI：ILI9341 240x320，竖屏 rotation 2（与 TFT_Test 完全一致）----
  ; 这一组必须留在 build_flags：它们编译 TFT_eSPI 库本身就要用。
  ; 引脚数字与 config.h 第 3 节的 PIN_TFT_xxx 必须保持一致，改线两边都改。
  -DUSER_SETUP_LOADED
  -DILI9341_DRIVER
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_MISO=-1
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=8
  -DTFT_BL=47
  -DTFT_BACKLIGHT_ON=1
  -DTFT_ROTATION=2
  ; 本工程的触摸**不走这条 SPI**：XPT2046 用的是独立的 T_CLK/T_DIN/T_DO/T_CS
  ; 五根线（见 config.h 第 3.2 节 + lib/TouchLib），屏的 MISO 本来就不接。
  ; TOUCH_CS 保持 -1 只是为了消掉 TFT_eSPI 那句“TOUCH_CS 未定义”的告警，
  ; 和触摸能不能用**没有任何关系**。
  -DTOUCH_CS=-1
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=16000000
  ; ESP32-S3 Arduino 核把 FSPI 映射成 0，TFT_eSPI 2.5.43 会把它当寄存器地址，
  ; 必须强制成真正的 SPI2 序号。
  -DUSE_FSPI_PORT

  ; ---- LVGL 8.4：屏上中文界面 ----
  ; lv_conf.h 放在 include/，靠上面的 -Iinclude 找到。
  ; LV_CONF_INCLUDE_SIMPLE        -> lvgl 内部用 #include "lv_conf.h"
  ; LV_LVGL_H_INCLUDE_SIMPLE      -> lvgl 内部用 #include "lvgl.h"
  ;   （第二条是必须的：src/ui_font_16.c 由 lv_font_conv 生成，它只在
  ;     LV_LVGL_H_INCLUDE_SIMPLE 定义时才 #include "lvgl.h"，否则会去找
  ;     "lvgl/lvgl.h" 而报 No such file or directory。）
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@8.4.0

upload_speed = 921600
monitor_speed = 115200
; ===========================================================================
; 下面几个是【排错用】环境，平时不用。
; 屏幕不亮时一次烧一个，看串口和屏幕，快速定位问题在哪一层：
;
;   一、整屏没内容（黑屏/白屏）——按 1 -> 2 -> 3 的顺序查，别一上来就怀疑字库：
;
;   pio run -e screen-raw  -t upload   只用 TFT_eSPI 画彩条，完全不初始化 LVGL
;   pio run -e screen-lvgl -t upload   彩条 + LVGL 纯色块（不碰任何字体）+ 刷屏日志
;   pio run -e screen-log  -t upload   正常界面 + 刷屏日志 + LVGL 日志
;
;   判读：
;     screen-raw 连彩条都没有         -> 和 LVGL、字库无关：查背光/接线/供电/屏驱动型号
;     screen-raw 有彩条、纯色块也有    -> 问题在字体那一层（缺字 / 压缩没开）
;     screen-raw 有彩条、纯色块没有    -> 问题在 LVGL 刷屏链路，看串口那行
;        “显示: 刷屏=xx次 …”：一直是 0 = LVGL 没在刷；
;        一直在涨但屏还是黑 = 数据发出去了，屏/背光/接线的问题
;
;   说明：整屏全黑/全白一定不是字库引起的——缺字只会让某几个汉字变空白，
;         标题栏底色、页面背景这些不用字体的地方照样会画出来。
;         不想重新烧录时，串口命令 d / d,1 能做同样的分层验证。
;
;   二、只怀疑中文字库时，用这两个环境做一键回退：
;
;   pio run -e font-stock -t upload   用回 LVGL 自带 simsun 子集字库
;   pio run -e font-off   -t upload   中文字库整个不用（只留英文数字）
;
; 判读：
;   font-stock 屏正常 -> 问题出在我生成的字库/字体开关
;   font-off   屏也黑 -> 问题不在字库，在屏幕接线/初始化/供电
; ===========================================================================

; ===========================================================================
; 排错环境（默认只放出 screen-log，其余先注释掉，免得 PlatformIO 任务列表太长）
;
;   要用哪个就把对应 [env:xxx] 前面的 ; 去掉（整段都要去掉），然后：
;     pio run -e screen-log -t upload
;
;   不想改这个文件也行：用环境变量临时加 -D（一次有效，不动 ini）：
;     $env:PLATFORMIO_BUILD_FLAGS="-DCFG_DISPLAY_FLUSH_LOG_MS=1000 -DCFG_LV_LOG_TO_SERIAL=1"
;     pio run -t upload
; ===========================================================================

; 用回 LVGL 自带的 simsun 子集字库（会缺字，但能验证显示链路）
;[env:font-stock]
;extends = env:esp32-s3-devkitc-1
;build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DCFG_FONT_CUSTOM_CJK=0

; 中文字库整个不用，只留 montserrat 英文
;[env:font-off]
;extends = env:esp32-s3-devkitc-1
;build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DCFG_FONT_CUSTOM_CJK=0 -DCFG_FONT_SELFCHECK=0

; 排错 1：只画 TFT_eSPI 彩条，完全不进 LVGL
;         验证 接线/供电/背光/SPI/屏驱动型号 这条链
;[env:screen-raw]
;extends = env:esp32-s3-devkitc-1
;build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DCFG_DISPLAY_BRINGUP=1

; 排错 2：彩条 + LVGL 纯色块（不碰字体）+ 刷屏心跳 + LVGL 日志
;         验证 LVGL 刷屏链路（tick / flush_cb / pushColors 字节序）
;[env:screen-lvgl]
;extends = env:esp32-s3-devkitc-1
;build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DCFG_DISPLAY_BRINGUP=2 -DCFG_DISPLAY_FLUSH_LOG_MS=1000 -DCFG_LV_LOG_TO_SERIAL=1

; 排错 3：正常界面，但每秒把“刷屏次数/LVGL 时钟/栈余量”打到串口，并打开 LVGL 日志
;         （界面和默认固件完全一样，只是多打几行日志，适合现在验触摸）
[env:screen-log]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DCFG_DISPLAY_FLUSH_LOG_MS=1000 -DCFG_LV_LOG_TO_SERIAL=1